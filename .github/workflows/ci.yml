name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evolution_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/evolution_test?sslmode=disable
        run: go test ./...

      - name: Build
        run: go build ./...
